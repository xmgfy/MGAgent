# MGAgent 基础设施服务 (MySQL + Milvus)
# 仅包含数据库和向量数据库服务，不含应用层
# 用于本地调试 MySQL + Milvus 方案

services:
  # MySQL 8.0 数据库
  mysql:
    image: mysql:8.0
    container_name: mgagent-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mgagent_root_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mgagent}
      MYSQL_USER: ${MYSQL_USER:-mgagent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mgagent_password_2024}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mgagent-network

  # Milvus Standalone - 向量数据库
  milvus:
    image: milvusdb/milvus:v2.4.12
    container_name: mgagent-milvus
    restart: always
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_GRPC_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mgagent-network

  # Milvus 依赖 - etcd
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: mgagent-etcd
    restart: always
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    networks:
      - mgagent-network

  # Milvus 依赖 - MinIO
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: mgagent-minio
    restart: always
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    networks:
      - mgagent-network

  # Milvus Attu (Web UI - 可选)
  attu:
    image: zilliz/attu:v2.4
    container_name: mgagent-attu
    restart: always
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8003:3000"
    depends_on:
      - milvus
    networks:
      - mgagent-network

volumes:
  mysql_data:
    driver: local
  milvus_data:
    driver: local
  etcd_data:
    driver: local
  minio_data:
    driver: local

networks:
  mgagent-network:
    driver: bridge
    name: mgagent-network
