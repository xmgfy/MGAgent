# MGAgent 生产环境完整部署配置
# 包含基础设施服务 + 应用层服务
# 使用方法: docker compose -f docker-compose.prod.yml up -d

services:
  # ==================== 基础设施服务 ====================

  # MySQL 8.0 数据库
  mysql:
    image: mysql:8.0
    container_name: mgagent-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mgagent-network

  # Milvus Standalone - 向量数据库
  milvus:
    image: milvusdb/milvus:v2.4.12
    container_name: mgagent-milvus
    restart: always
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_GRPC_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mgagent-network

  # Milvus 依赖 - etcd
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: mgagent-etcd
    restart: always
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    networks:
      - mgagent-network

  # Milvus 依赖 - MinIO
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: mgagent-minio
    restart: always
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    networks:
      - mgagent-network

  # ==================== 应用层服务 ====================

  # Chat 后端服务
  mgagent-backend:
    build:
      context: ./mgagent-backend
      dockerfile: Dockerfile
    container_name: mgagent-backend
    restart: always
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - ADMIN_API_URL=http://mgagent-admin-backend:8001/admin/api
      - DEBUG=False
      - HF_HOME=/root/.cache/huggingface
    ports:
      - "${CHAT_BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_data:/app/data
      - ${MGAGENT_HF_CACHE:-./.cache/huggingface}:/root/.cache/huggingface
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - mgagent-network

  # Admin 后端服务
  mgagent-admin-backend:
    build:
      context: ./mgagent-admin-backend
      dockerfile: Dockerfile
    container_name: mgagent-admin-backend
    restart: always
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - DEBUG=False
      - HF_HOME=/root/.cache/huggingface
    ports:
      - "${ADMIN_BACKEND_PORT:-8001}:8001"
    volumes:
      - admin_backend_data:/app/data
      - ${MGAGENT_HF_CACHE:-./.cache/huggingface}:/root/.cache/huggingface
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/admin/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - mgagent-network

  # Chat 前端服务 (Nginx)
  mgagent-frontend:
    build:
      context: ./mgagent-frontend
      dockerfile: Dockerfile
    container_name: mgagent-frontend
    restart: always
    ports:
      - "${CHAT_FRONTEND_PORT:-3000}:80"
    depends_on:
      mgagent-backend:
        condition: service_healthy
    networks:
      - mgagent-network

  # Admin 前端服务 (Nginx)
  mgagent-admin-frontend:
    build:
      context: ./mgagent-admin-frontend
      dockerfile: Dockerfile
    container_name: mgagent-admin-frontend
    restart: always
    ports:
      - "${ADMIN_FRONTEND_PORT:-3001}:80"
    depends_on:
      mgagent-admin-backend:
        condition: service_healthy
    networks:
      - mgagent-network

  # Attu - Milvus 可视化管理 (可选)
  attu:
    image: zilliz/attu:v2.4
    container_name: mgagent-attu
    restart: always
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "${ATTU_PORT:-8003}:3000"
    depends_on:
      milvus:
        condition: service_healthy
    networks:
      - mgagent-network

volumes:
  mysql_data:
    driver: local
  milvus_data:
    driver: local
  etcd_data:
    driver: local
  minio_data:
    driver: local
  backend_data:
    driver: local
  admin_backend_data:
    driver: local

networks:
  mgagent-network:
    driver: bridge
    name: mgagent-network